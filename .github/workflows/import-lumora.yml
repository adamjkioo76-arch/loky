name: Import and Deploy LUMORA

'on':
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lumora-pages
  cancel-in-progress: false

jobs:
  import-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract updated project
        run: |
          mkdir -p "$RUNNER_TEMP/lumora"
          unzip -q lumora-fixed.zip -d "$RUNNER_TEMP/lumora"

          test -f "$RUNNER_TEMP/lumora/loky-main/package.json"

          rsync -a \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='.git/' \
            "$RUNNER_TEMP/lumora/loky-main/" ./

          rm -f lumora-fixed.zip

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import fixed LUMORA project"
            git push origin main
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
